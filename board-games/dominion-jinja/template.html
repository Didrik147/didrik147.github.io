<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <title>Dominion</title>
</head>

<body>
  <h1>Dominion: Recommended sets of 10</h1>
  <p class="italic text-center">Players can play Dominion with any set of 10 Kingdom cards, but these sets have been specially picked out to be entertaining and show off card interactions and strategies.</p>
  <div class="card-grid">
    {% for card in cards %}
    <div class="card">
      <!-- Image -->
      <div class="image-container">
        <img src="{{ card.img }}" alt="{{ card.name }}" loading="lazy">
      </div>
    </div>
    {% endfor %}
  </div>
</body>

</html>
