<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <title>Dominion</title>
</head>

<body>
  <h1>Dominion: Recommended sets of 10</h1>
  <p class="italic text-center">Players can play Dominion with any set of 10 Kingdom cards, but these sets have been specially picked out to be entertaining and show off card interactions and strategies.</p>
  <div class="card-grid">
    
    <div class="card">
      <!-- Image -->
      <div class="image-container">
        <img src="./images/prosperity2add/prosperity2add_tiara.jpg" alt="Tiara" loading="lazy">
      </div>
    </div>
    
    <div class="card">
      <!-- Image -->
      <div class="image-container">
        <img src="./images/prosperity/prosperity_monument.jpg" alt="Monument" loading="lazy">
      </div>
    </div>
    
    <div class="card">
      <!-- Image -->
      <div class="image-container">
        <img src="./images/prosperity/prosperity_bishop.jpg" alt="Bishop" loading="lazy">
      </div>
    </div>
    
    <div class="card">
      <!-- Image -->
      <div class="image-container">
        <img src="./images/prosperity/prosperity_peddler.jpg" alt="Peddler" loading="lazy">
      </div>
    </div>
    
    <div class="card">
      <!-- Image -->
      <div class="image-container">
        <img src="./images/intrigue/intrigue_harem.jpg" alt="Harem" loading="lazy">
      </div>
    </div>
    
    <div class="card">
      <!-- Image -->
      <div class="image-container">
        <img src="./images/intrigue/intrigue_pawn.jpg" alt="Pawn" loading="lazy">
      </div>
    </div>
    
    <div class="card">
      <!-- Image -->
      <div class="image-container">
        <img src="./images/intrigue/intrigue_shantytown.jpg" alt="Shanty Town" loading="lazy">
      </div>
    </div>
    
    <div class="card">
      <!-- Image -->
      <div class="image-container">
        <img src="./images/intrigue/intrigue_upgrade.jpg" alt="Upgrade" loading="lazy">
      </div>
    </div>
    
    <div class="card">
      <!-- Image -->
      <div class="image-container">
        <img src="./images/intrigue/intrigue_greathall.jpg" alt="Great Hall" loading="lazy">
      </div>
    </div>
    
  </div>
</body>

</html>
